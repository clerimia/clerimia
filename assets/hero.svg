<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="clerimia — 一边创作，一边成为自己"><title>clerimia — 一边创作，一边成为自己</title>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f7050"/><stop offset="1" stop-color="#263b2e"/></linearGradient>
<style>
  .vine { transform-box: fill-box; transform-origin: 0% 100%; animation: sway 13s ease-in-out infinite alternate; }
