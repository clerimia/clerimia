  <text y="198" font-size="56" font-weight="800" fill="#263b2e" letter-spacing="0.5"><tspan fill="url(#accent)">一边</tspan>创作，</text>
  <text y="266" font-size="56" font-weight="800" fill="#263b2e" letter-spacing="0.5"><tspan fill="url(#accent)">一边</tspan>成为自己<tspan fill="#3f7050">。</tspan></text>
  <text y="314" font-size="19" fill="#48604e">合肥工业大学在读，关注 <tspan fill="#263b2e" font-weight="600">AI Agent</tspan> 与 <tspan fill="#263b2e" font-weight="600">全栈开发</tspan>。</text>
</g>

